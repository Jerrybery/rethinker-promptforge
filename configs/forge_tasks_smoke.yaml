- id: forge-train-can-pot-distractor
  instruction: Pick up the can and move it into the pot, despite the clutter on the
    table.
  mission_type: PICK_AND_PLACE
  objects:
  - can
  - pot
  initial_scene:
    task_name: move_can_pot
    embodiment:
    - franka-panda
    domain_randomization:
      random_background: false
      cluttered_table: true
      clean_background_rate: 0
      random_head_camera_dis: 0
      random_table_height: 0
      random_light: false
      crazy_random_light_rate: 0
    seed: 302
    render_freq: 0
    save_data: false
    collect_data: false
  success_criteria:
  - can is inside the pot
  - pot remains upright at its original position
  metadata:
    split: train
    forge_role: prompt_training
    category: forge_occlusion
    difficulty: medium
    occlusion_pattern: occ-distractor-staticcam-fixedlight
    occlusion_axes:
      clutter: true
      lighting: fixed
      camera: static
    occlusion_sources:
    - distractor clutter objects partially occlude the can from the head camera
    - pot rim occludes the can from the head camera during the final approach
    seed_range:
    - 302
    - 399
    max_rounds: 8
    allowed_actions:
    - PICK_AND_PLACE
    - PICK_ONLY
    - MOVE_ASIDE
    - REOBSERVE
    - STOP
    failure_criteria:
    - can dropped outside the pot
    - pot tipped over or pushed off its original position
    - max_rounds exceeded
    robottwin_task_name: move_can_pot
    robottwin_task_config: demo_clean
    object_actors:
      can: can
      pot: pot
    place_offsets:
      pot:
        offset:
        - 0.18
        - 0.0
        - 0.0
        mirror_with_arm: true
- id: forge-train-can-pot-occluded
  instruction: Move the can next to the pot. The can is hidden behind another
    object and is not visible; move the occluding object aside to find it first.
  mission_type: PICK_AND_PLACE
  objects:
  - can
  - pot
  - occluder
  initial_scene:
    task_name: move_can_pot_occluded
    embodiment:
    - franka-panda
    domain_randomization:
      random_background: false
      cluttered_table: false
      clean_background_rate: 0
      random_head_camera_dis: 0
      random_table_height: 0
      random_light: false
      crazy_random_light_rate: 0
    seed: 301
    render_freq: 0
    save_data: false
    collect_data: false
  success_criteria:
  - can is placed next to the pot
  - pot remains upright at its original position
  metadata:
    split: train
    forge_role: prompt_training
    category: forge_occlusion
    difficulty: hard
    occlusion_pattern: occ-cover-hidden-target
    occlusion_axes:
      clutter: false
      lighting: fixed
      camera: static
    occlusion_sources:
    - a cup is parked next to the target can and covers it; the can stays
      hidden from the detection set until the occluder is moved aside
    seed_range:
    - 301
    - 330
    max_rounds: 8
    allowed_actions:
    - PICK_AND_PLACE
    - PICK_ONLY
    - MOVE_ASIDE
    - REOBSERVE
    - STOP
    failure_criteria:
    - can dropped outside the table workspace
    - pot tipped over or pushed off its original position
    - max_rounds exceeded
    robottwin_task_name: move_can_pot_occluded
    robottwin_task_config: demo_clean
    object_actors:
      can: can
      pot: pot
      occluder: occluder
    hidden_by:
      can:
      - occluder
    cover_radius: 0.25
    grasp_contact_point_id: true
    place_offsets:
      pot:
        offset:
        - 0.18
        - 0.0
        - 0.0
        mirror_with_arm: true
- id: forge-val-empty-cup-noclutter-randomcam-randomlight
  instruction: Pick up the empty cup and place it upright on the coaster, despite
    the changing lighting and varying camera viewpoint.
  mission_type: PICK_AND_PLACE
  objects:
  - cup
  - coaster
  initial_scene:
    task_name: place_empty_cup
    embodiment:
    - franka-panda
    domain_randomization:
      random_background: false
      cluttered_table: false
      clean_background_rate: 0
      random_head_camera_dis: 0.1
      random_table_height: 0
      random_light: true
      crazy_random_light_rate: 0.1
    seed: 960
    render_freq: 0
    save_data: false
    collect_data: false
  success_criteria:
  - cup is placed upright on the coaster
  - gripper is open and clear of the cup at episode end
  metadata:
    split: val
    forge_role: prompt_validation
    category: forge_occlusion
    difficulty: hard
    occlusion_pattern: occ-nodistractor-randomcam-randomlight
    occlusion_axes:
      clutter: false
      lighting: random
      camera: random
    occlusion_sources:
    - randomized head-camera viewpoint yields partially visible cup poses unseen in
      train
    - randomized lighting casts shadows and glare that obscure the cup rim and body
    - gripper occludes the cup during the grasp
    seed_range:
    - 960
    - 989
    max_rounds: 8
    allowed_actions:
    - PICK_AND_PLACE
    - PICK_ONLY
    - MOVE_ASIDE
    - REOBSERVE
    - STOP
    failure_criteria:
    - cup dropped or tipped over
    - max_rounds exceeded
    robottwin_task_name: place_empty_cup
    robottwin_task_config: demo_clean
    object_actors:
      cup: cup
      coaster: coaster
    grasp_contact_point_id: true
